services:
  - type: web
    name: silent_skill_gap_backend
    env: image
    image:
      url: docker.io/YOUR_DOCKERHUB_USERNAME/silent-skill-gap-backend:latest
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://silent-skill-gap-frontend.onrender.com,https://silent-skill-gap-ai-system.onrender.com"

      - key: JWT_SECRET
        generateValue: true
      - key: ML_SERVICE_URL
        sync: false

  - type: web
    name: silent_skill_gap_ml_service
    env: image
    image:
      url: docker.io/abhishekkrnishad/silent-skill-gap-ml-service:latest
    plan: free
    envVars:
      - key: MODEL_PATH
        value: "models/"
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: silent_skill_gap_frontend
    env: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    plan: free
    envVars:
      - key: VITE_API_URL
        value: "https://silent-skill-gap-backend.onrender.com"
