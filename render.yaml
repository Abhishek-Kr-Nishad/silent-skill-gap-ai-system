databases:
  - name: silent_skill_gap_db
    databaseName: silent_skill_gap
    user: render_user
    plan: free

services:
  - type: web
    name: silent_skill_gap_backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: silent_skill_gap_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://silent-skill-gap-frontend.onrender.com"
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: silent_skill_gap_ml_service
    env: docker
    dockerContext: ./ml_service
    dockerfilePath: ./ml_service/Dockerfile
    plan: free
    envVars:
      - key: MODEL_PATH
        value: "models/"

  - type: web
    name: silent_skill_gap_frontend
    env: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    plan: free
    envVars:
      - key: VITE_API_URL
        value: "https://silent-skill-gap-backend.onrender.com"
